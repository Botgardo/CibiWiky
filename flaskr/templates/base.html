<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{% endblock %} - CibiWiky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">
      <svg class="brand-mark" width="20" height="22" viewBox="0 0 20 22" aria-hidden="true">
        <path d="M5.5 0h9L20 22H0z" fill="currentColor"/>
      </svg>
      CibiWiky
    </a>
    <nav aria-label="Principal">
      {% if g.user %}
      <span class="who">{{ g.user['username'] }}</span>
      <a href="{{ url_for('chat.chat') }}">Mis chats</a>
      <a href="{{ url_for('auth.logout') }}">Salir</a>
      {% else %}
      <a href="{{ url_for('auth.login') }}">Iniciar sesión</a>
      <a class="btn btn-solid" href="{{ url_for('auth.register') }}">Crear cuenta</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% for message in get_flashed_messages() %}
    <div class="flash" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>CibiWiky. Proyecto de Sistemas Distribuidos, UABC.</p>
  </footer>
</body>

</html>
