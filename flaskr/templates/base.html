<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - CibiWiky</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">CibiWiky</a>
    <nav>
      {% if g.user %}
      <a class="action" href="{{ url_for('chat.chat') }}">New</a>
      <a class="action" href="{{ url_for('auth.logout') }}">Salir</a>
      {% else %}
      <a href="{{ url_for('auth.login') }}">Iniciar sesión</a>
      <a class="btn btn-solid" href="{{ url_for('auth.register') }}">Crear cuenta</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>CibiWiky · Proyecto de Sistemas Distribuidos · UABC</p>
  </footer>
</body>

</html>
