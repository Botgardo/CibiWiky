<aside class="sidebar" id="chat-sidebar" aria-label="Tus chats">
  <form method="post" action="{{ url_for('chat.new') }}">
    <button type="submit" class="btn btn-solid btn-block">Nuevo chat</button>
  </form>

  <nav>
    <ul class="chat-list">
      {% for c in chats %}
      <li>
        <a href="{{ url_for('chat.view', chat_id=c['id']) }}"
           class="chat-item{{ ' active' if chat and chat['id'] == c['id'] }}"
           {% if chat and chat['id'] == c['id'] %}aria-current="page"{% endif %}
           title="{{ c['title'] }}">{{ c['title'] }}</a>
      </li>
      {% else %}
      <li class="chat-empty">Aún no tienes chats</li>
      {% endfor %}
    </ul>
  </nav>
</aside>
