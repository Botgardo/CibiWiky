{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<section class="auth">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <label for="username">Usuario</label>
    <input name="username" id="username" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input type="password" name="password" id="password" autocomplete="current-password" required>
    <button class="btn btn-solid btn-block" type="submit">Entrar</button>
  </form>
  <p class="form-alt">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Crea una</a></p>
</section>
{% endblock %}
