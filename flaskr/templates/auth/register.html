{% extends 'base.html' %}
{% block title %}Crear cuenta{% endblock %}

{% block content %}
<section class="auth">
  <h1>Crear cuenta</h1>
  <form method="post">
    <label for="username">Usuario</label>
    <input name="username" id="username" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input type="password" name="password" id="password" autocomplete="new-password" required>
    <button class="btn btn-solid btn-block" type="submit">Crear cuenta</button>
  </form>
  <p class="form-alt">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
</section>
{% endblock %}
